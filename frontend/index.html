<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda</title>
    <link rel="icon" type="image/png" href="Logo.png">

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <section id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <img src="Logo.png" alt="Andromeda" class="auth-logo">
            <h1 id="auth-title">Welcome to Andromeda</h1>
            <p id="auth-subtitle">Sign in to continue.</p>
            <form id="auth-form">
                <label id="name-field" class="auth-field hidden">
                    Name
                    <input id="name-input" type="text" autocomplete="name" maxlength="100">
                </label>
                <label class="auth-field">
                    Email
                    <input id="email-input" type="email" autocomplete="email" required>
                </label>
                <label class="auth-field">
                    Password
                    <input id="password-input" type="password" autocomplete="current-password" minlength="8" required>
                </label>
                <p id="auth-error" class="auth-error" role="alert"></p>
                <button id="auth-submit" class="auth-submit" type="submit">Sign in</button>
            </form>
            <button id="auth-toggle" class="auth-toggle" type="button">Create an account</button>
            <button id="guest-button" class="auth-toggle" type="button">Continue as guest</button>
        </div>
    </section>

    <header id="user-profile" class="user-profile hidden">
        <div>
            <div id="user-name" class="user-name"></div>
            <div id="user-email" class="user-email"></div>
        </div>
        <button id="logout" class="logout-button" type="button">Log out</button>
    </header>

    <aside id="conversation-sidebar" class="conversation-sidebar hidden">
        <div class="sidebar-heading">
            <span>Conversations</span>
            <button id="new-conversation" class="new-conversation" type="button">+</button>
        </div>
        <div id="conversation-list"></div>
    </aside>

    <div id="idle-state" aria-hidden="true">
        <img src="Logo.png" alt="">
        <span>Andromeda</span>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <div id="input-shell">
            <input
                id="input"
                type="text"
                placeholder="Ask Andromeda anything..."
                autocomplete="off"
            />
            <button id="send" aria-label="Send message" title="Send message">
                <span aria-hidden="true">↑</span>
            </button>
        </div>
        <span id="connection-indicator" class="connection-indicator" aria-label="Disconnected" title="Disconnected"></span>
    </div>
    <script src="main.js"></script>

</body>
</html>
