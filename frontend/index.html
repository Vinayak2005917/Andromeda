<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda</title>
    <link rel="icon" type="image/png" href="Logo.png">

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div id="idle-state" aria-hidden="true">
        <img src="Logo.png" alt="">
        <span>Andromeda</span>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <div id="input-shell">
            <input
                id="input"
                type="text"
                placeholder="Ask Andromeda anything..."
                autocomplete="off"
            />
            <button id="send" aria-label="Send message" title="Send message">
                <span aria-hidden="true">↑</span>
            </button>
        </div>
        <span id="connection-indicator" class="connection-indicator" aria-label="Disconnected" title="Disconnected"></span>
    </div>
    <script src="main.js"></script>

</body>
</html>
