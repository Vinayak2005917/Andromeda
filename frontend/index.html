<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda</title>
    <link rel="icon" type="image/png" href="Logo.png">

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <section id="auth-screen" class="auth-screen">
        <a class="auth-github" href="https://github.com/Vinayak2005917/Andromeda" target="_blank" rel="noopener noreferrer">
            <img src="GitHub_logo_White.png" alt="GitHub">
            <span>Vinayak2005917/Andromeda</span>
        </a>
        <div class="auth-promo">
            <h1>Andromeda</h1>
            <p style="font-size: large;"><strong>Keep what matters in your orbit.</strong></p>
            <p>Put something in your Orbit and Andromeda will keep track of it,
                Watching for the moment it matters to you.
                So you can focus on what matters to you in the moment.
            </p>
            <button id="guest-button" class="quick-demo-button" type="button">Quick Demo?</button>
        </div>
        <div class="auth-card">
            <p id="auth-subtitle">Sign in to continue.</p>
            <form id="auth-form">
                <label id="name-field" class="auth-field hidden">
                    Name
                    <input id="name-input" type="text" autocomplete="name" maxlength="100">
                </label>
                <label class="auth-field">
                    Email
                    <input id="email-input" type="email" autocomplete="email" required>
                </label>
                <label class="auth-field">
                    Password
                    <span class="password-field">
                        <input id="password-input" type="password" autocomplete="current-password" minlength="8" required>
                        <button id="toggle-password" class="toggle-password" type="button" aria-label="Show password" title="Show password">◉</button>
                    </span>
                </label>
                <p id="auth-error" class="auth-error" role="alert"></p>
                <div class="auth-actions">
                    <button id="auth-submit" class="auth-action-button" type="submit">Continue!</button>
                    <button id="auth-toggle" class="auth-action-button" type="button">I am new here</button>
                </div>
            </form>
        </div>
    </section>

    <aside id="conversation-sidebar" class="conversation-sidebar hidden">
        <div class="sidebar-heading">
            <span>History</span>
            <div class="sidebar-actions">
                <button id="new-conversation" class="new-conversation" type="button" aria-label="New conversation" title="New conversation">
                    <img src="Logo.png" alt="">
                </button>
                <button id="collapse-sidebar" class="collapse-sidebar" type="button" aria-label="Collapse history" title="Collapse history">‹</button>
            </div>
        </div>
        <label class="keep-conversation">
            <input id="keep-conversation" type="checkbox">
            <span>Keep conversation on reload</span>
        </label>
        <div id="conversation-list"></div>
    </aside>

    <button id="logout" class="logout-button hidden" type="button">Log out</button>

    <div id="idle-state" aria-hidden="true">
        <img src="Logo.png" alt="">
        <span>Andromeda</span>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <div id="input-shell">
            <input
                id="input"
                type="text"
                placeholder="Ask Andromeda anything..."
                autocomplete="off"
            />
            <button id="send" aria-label="Send message" title="Send message">
                <span aria-hidden="true">↑</span>
            </button>
        </div>
        <span id="connection-indicator" class="connection-indicator" aria-label="Disconnected" title="Disconnected"></span>
    </div>
    <script src="main.js"></script>

</body>
</html>
