<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Agent</title>

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
        }

        .agent {
            align-self: flex-start;
            background: #222;
        }

        /* Markdown styling */
        .agent pre {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .agent code {
            font-family: monospace;
        }

        .agent p:first-child {
            margin-top: 0;
        }

        .agent p:last-child {
            margin-bottom: 0;
        }

        #input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #333;
        }

        #input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div id="chat"></div>

    <div id="input-area">
        <input
            id="input"
            type="text"
            placeholder="Ask something..."
            autocomplete="off"
        />

        <button id="send">Send</button>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const sendButton = document.getElementById("send");

        function addMessage(content, type, markdown = false) {
            const message = document.createElement("div");
            message.classList.add("message", type);

            if (markdown) {
                message.innerHTML = marked.parse(content);
            } else {
                message.textContent = content;
            }

            chat.appendChild(message);

            // Scroll to bottom
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const userInput = input.value.trim();

            if (!userInput) return;

            // Show user message
            addMessage(userInput, "user");

            input.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch(
                    `http://localhost:8025/ask?user_input=${encodeURIComponent(userInput)}`
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                // Render agent response as Markdown
                addMessage(data.response, "agent", true);

            } catch (error) {
                console.error(error);

                addMessage(
                    `**Error:** Could not connect to the agent.`,
                    "agent",
                    true
                );
            }

            sendButton.disabled = false;
            input.focus();
        }

        sendButton.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>
</html>
